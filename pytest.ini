[tool:pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py *_steps.py
python_classes = *Test
python_functions = test_*
addopts =
    --verbose
    --color=yes
    --strict-markers
    --strict-config
    --tb=short
    --bdd-feature-base-dir=tests/features
    -p no:warnings
markers =
    bdd: BDD tests
    integration: Integration tests
    slow: Slow running tests
    async: Async tests